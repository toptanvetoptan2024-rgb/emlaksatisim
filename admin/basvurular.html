<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Başvurular | EmlakSatisim</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f8;
    color:#172033;
}

.header{
    background:#111827;
    color:white;
    padding:22px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header h1{
    margin:0;
    font-size:24px;
}

.header a{
    color:white;
    text-decoration:none;
    background:#d89b32;
    padding:10px 16px;
    border-radius:8px;
    font-weight:bold;
}

.container{
    max-width:1400px;
    margin:30px auto;
    padding:0 20px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-bottom:25px;
}

.card{
    background:white;
    border-radius:14px;
    padding:24px;
    box-shadow:0 3px 15px rgba(0,0,0,.06);
}

.card-title{
    color:#6b7280;
    font-size:14px;
    margin-bottom:10px;
}

.card-value{
    font-size:30px;
    font-weight:800;
}

.table-box{
    background:white;
    border-radius:14px;
    padding:20px;
    box-shadow:0 3px 15px rgba(0,0,0,.06);
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:950px;
}

th{
    background:#f8fafc;
    text-align:left;
    padding:14px;
    font-size:13px;
    color:#64748b;
}

td{
    padding:15px 14px;
    border-top:1px solid #eef2f7;
    font-size:14px;
}

.durum{
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.beklemede{
    background:#fff3cd;
    color:#946200;
}

.yayinda{
    background:#dcfce7;
    color:#166534;
}

.satildi{
    background:#dbeafe;
    color:#1d4ed8;
}

.iptal{
    background:#fee2e2;
    color:#991b1b;
}

.detay-btn{
    border:0;
    background:#111827;
    color:white;
    padding:8px 13px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.detay-btn:hover{
    opacity:.85;
}

/* MODAL */

#modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:9999;
    padding:30px 15px;
    overflow:auto;
}

.modal-box{
    background:white;
    max-width:800px;
    margin:20px auto;
    border-radius:16px;
    padding:28px;
    position:relative;
}

.modal-close{
    position:absolute;
    right:20px;
    top:18px;
    width:35px;
    height:35px;
    border:0;
    border-radius:50%;
    background:#f1f5f9;
    font-size:20px;
    cursor:pointer;
}

.modal-title{
    margin:0 45px 25px 0;
    font-size:24px;
}

.detail-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
}

.detail{
    background:#f8fafc;
    padding:14px;
    border-radius:9px;
}

.detail strong{
    display:block;
    color:#64748b;
    font-size:12px;
    margin-bottom:5px;
}

.detail span{
    font-weight:bold;
    word-break:break-word;
}

.description{
    margin-top:15px;
    background:#f8fafc;
    padding:15px;
    border-radius:9px;
    line-height:1.6;
}

.actions{
    margin-top:22px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.actions button{
    border:0;
    color:white;
    padding:12px 18px;
    border-radius:8px;
    font-weight:800;
    cursor:pointer;
}

.btn-yayinda{
    background:#16a34a;
}

.btn-satildi{
    background:#2563eb;
}

.btn-iptal{
    background:#dc2626;
}

.btn-beklemede{
    background:#f59e0b;
}

.loading{
    text-align:center;
    padding:40px;
    color:#64748b;
}

.error{
    background:#fee2e2;
    color:#991b1b;
    padding:18px;
    border-radius:10px;
    margin-bottom:20px;
}

/* MOBİL */

@media(max-width:800px){

    .header{
        padding:18px;
    }

    .header h1{
        font-size:19px;
    }

    .container{
        margin:20px auto;
        padding:0 12px;
    }

    .cards{
        grid-template-columns:1fr;
        gap:12px;
    }

    .card{
        padding:18px;
    }

    .card-value{
        font-size:25px;
    }

    .table-box{
        padding:10px;
    }

    .modal-box{
        padding:20px;
    }

    .detail-grid{
        grid-template-columns:1fr;
    }

    .actions{
        flex-direction:column;
    }

    .actions button{
        width:100%;
    }

}

</style>
</head>

<body>

<div class="header">

    <h1>📋 İlan Başvuruları</h1>

    <a href="dashboard.html">
        ← Panele Dön
    </a>

</div>


<div class="container">

    <div class="cards">

        <div class="card">
            <div class="card-title">
                Toplam Başvuru
            </div>

            <div
                class="card-value"
                id="toplamBasvuru"
            >
                0
            </div>
        </div>


        <div class="card">
            <div class="card-title">
                Onay Bekleyen
            </div>

            <div
                class="card-value"
                id="bekleyenBasvuru"
            >
                0
            </div>
        </div>


        <div class="card">
            <div class="card-title">
                Son Başvuru
            </div>

            <div
                class="card-value"
                id="sonBasvuru"
                style="font-size:18px;"
            >
                -
            </div>
        </div>

    </div>


    <div
        id="hata"
        class="error"
        style="display:none;"
    ></div>


    <div class="table-box">

        <div id="yukleniyor" class="loading">
            Başvurular yükleniyor...
        </div>


        <table id="basvuruTablosu" style="display:none;">

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Ad Soyad</th>

                    <th>Telefon</th>

                    <th>Gayrimenkul</th>

                    <th>İlçe</th>

                    <th>Fiyat</th>

                    <th>Durum</th>

                    <th>Tarih</th>

                    <th>İşlem</th>

                </tr>

            </thead>

            <tbody id="basvuruListesi">

            </tbody>

        </table>

    </div>

</div>


<!-- DETAY MODALI -->

<div id="modal">

    <div class="modal-box">

        <button
            class="modal-close"
            onclick="modalKapat()"
        >
            ×
        </button>

        <h2
            class="modal-title"
            id="modalBaslik"
        >
            İlan Detayı
        </h2>

        <div id="modalIcerik"></div>

    </div>

</div>


<script>

let ilanlar = [];


/* BAŞVURULARI GETİR */

async function basvurulariGetir(){

    const yukleniyor =
        document.getElementById("yukleniyor");

    const tablo =
        document.getElementById("basvuruTablosu");

    const hata =
        document.getElementById("hata");

    try{

        hata.style.display = "none";

        const cevap =
            await fetch("/api/ilanlar");

        const sonuc =
            await cevap.json();

        if(
            !cevap.ok ||
            !sonuc.basarili
        ){
            throw new Error(
                sonuc.hata ||
                "Başvurular alınamadı."
            );
        }

        ilanlar =
            sonuc.ilanlar || [];

        tablo.style.display = "table";

        yukleniyor.style.display = "none";

        tabloyuDoldur();

        istatistikleriGuncelle();

    }
    catch(err){

        yukleniyor.style.display = "none";

        hata.style.display = "block";

        hata.textContent =
            "Başvurular yüklenemedi: " +
            err.message;

    }

}


/* TABLOYU DOLDUR */

function tabloyuDoldur(){

    const liste =
        document.getElementById(
            "basvuruListesi"
        );

    liste.innerHTML = "";


    if(ilanlar.length === 0){

        liste.innerHTML = `
            <tr>
                <td colspan="9"
                    style="text-align:center;padding:40px;">
                    Henüz başvuru bulunmuyor.
                </td>
            </tr>
        `;

        return;

    }


    ilanlar.forEach(function(ilan){

        const fiyat =
            ilan.fiyat
            ? Number(ilan.fiyat)
                .toLocaleString("tr-TR") + " TL"
            : "-";


        const tarih =
            ilan.olusturma_tarihi
            ? new Date(
                ilan.olusturma_tarihi
              ).toLocaleString(
                "tr-TR"
              )
            : "-";


        const durum =
            ilan.durum || "beklemede";


        const durumYazi =
            durumMetni(durum);


        liste.innerHTML += `

            <tr>

                <td>
                    #${ilan.id}
                </td>

                <td>
                    <strong>
                        ${guvenliMetin(ilan.ad_soyad)}
                    </strong>
                </td>

                <td>
                    ${guvenliMetin(ilan.telefon)}
                </td>

                <td>
                    ${guvenliMetin(ilan.ilan_turu)}
                </td>

                <td>
                    ${guvenliMetin(ilan.ilce || "-")}
                </td>

                <td>
                    ${fiyat}
                </td>

                <td>

                    <span class="durum ${durum}">
                        ${durumYazi}
                    </span>

                </td>

                <td>
                    ${tarih}
                </td>

                <td>

                    <button
                        class="detay-btn"
                        onclick="detayGoster(${ilan.id})"
                    >
                        Detay
                    </button>

                </td>

            </tr>

        `;

    });

}


/* DURUM YAZISI */

function durumMetni(durum){

    const durumlar = {

        beklemede:
            "Onay Bekliyor",

        yayinda:
            "Yayında",

        satildi:
            "Satıldı",

        iptal:
            "İptal Edildi"

    };

    return durumlar[durum] || durum;

}


/* GÜVENLİ METİN */

function guvenliMetin(metin){

    if(
        metin === null ||
        metin === undefined
    ){
        return "-";
    }

    return String(metin)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* İSTATİSTİKLER */

function istatistikleriGuncelle(){

    document.getElementById(
        "toplamBasvuru"
    ).textContent =
        ilanlar.length;


    const bekleyen =
        ilanlar.filter(function(ilan){

            return (
                ilan.durum === "beklemede" ||
                !ilan.durum
            );

        }).length;


    document.getElementById(
        "bekleyenBasvuru"
    ).textContent =
        bekleyen;


    if(ilanlar.length > 0){

        document.getElementById(
            "sonBasvuru"
        ).textContent =
            ilanlar[0].olusturma_tarihi
            ? new Date(
                ilanlar[0].olusturma_tarihi
              ).toLocaleDateString(
                "tr-TR"
              )
            : "-";

    }

}


/* DETAY GÖSTER */

function detayGoster(id){

    const ilan =
        ilanlar.find(function(item){

            return Number(item.id) === Number(id);

        });


    if(!ilan){
        return;
    }


    document.getElementById(
        "modalBaslik"
    ).textContent =
        "#" + ilan.id +
        " - " +
        (ilan.ad_soyad || "İlan Detayı");


    const fiyat =
        ilan.fiyat
        ? Number(ilan.fiyat)
            .toLocaleString("tr-TR") +
            " TL"
        : "-";


    document.getElementById(
        "modalIcerik"
    ).innerHTML = `

        <div class="detail-grid">

            <div class="detail">
                <strong>Ad Soyad</strong>
                <span>
                    ${guvenliMetin(ilan.ad_soyad)}
                </span>
            </div>


            <div class="detail">
                <strong>Telefon</strong>
                <span>
                    ${guvenliMetin(ilan.telefon)}
                </span>
            </div>


            <div class="detail">
                <strong>E-posta</strong>
                <span>
                    ${guvenliMetin(ilan.email || "-")}
                </span>
            </div>


            <div class="detail">
                <strong>Gayrimenkul Türü</strong>
                <span>
                    ${guvenliMetin(ilan.ilan_turu)}
                </span>
            </div>


            <div class="detail">
                <strong>İşlem Türü</strong>
                <span>
                    ${guvenliMetin(ilan.islem_turu)}
                </span>
            </div>


            <div class="detail">
                <strong>İl</strong>
                <span>
                    ${guvenliMetin(ilan.il || "-")}
                </span>
            </div>


            <div class="detail">
                <strong>İlçe</strong>
                <span>
                    ${guvenliMetin(ilan.ilce || "-")}
                </span>
            </div>


            <div class="detail">
                <strong>Mahalle</strong>
                <span>
                    ${guvenliMetin(ilan.mahalle || "-")}
                </span>
            </div>


            <div class="detail">
                <strong>Fiyat</strong>
                <span>
                    ${fiyat}
                </span>
            </div>


            <div class="detail">
                <strong>m²</strong>
                <span>
                    ${guvenliMetin(ilan.metrekare || "-")}
                </span>
            </div>


            <div class="detail">
                <strong>Oda Sayısı</strong>
                <span>
                    ${guvenliMetin(ilan.oda_sayisi || "-")}
                </span>
            </div>


            <div class="detail">
                <strong>Bina Yaşı</strong>
                <span>
                    ${guvenliMetin(ilan.bina_yasi || "-")}
                </span>
            </div>


            <div class="detail">
                <strong>Kat</strong>
                <span>
                    ${guvenliMetin(ilan.kat || "-")}
                </span>
            </div>


            <div class="detail">
                <strong>Toplam Kat</strong>
                <span>
                    ${guvenliMetin(ilan.toplam_kat || "-")}
                </span>
            </div>


            <div class="detail">
                <strong>Isıtma</strong>
                <span>
                    ${guvenliMetin(ilan.isitma || "-")}
                </span>
            </div>


            <div class="detail">
                <strong>Balkon</strong>
                <span>
                    ${guvenliMetin(ilan.balkon || "-")}
                </span>
            </div>


            <div class="detail">
                <strong>Otopark</strong>
                <span>
                    ${guvenliMetin(ilan.otopark || "-")}
                </span>
            </div>


            <div class="detail">
                <strong>Mevcut Durum</strong>
                <span>
                    ${durumMetni(
                        ilan.durum || "beklemede"
                    )}
                </span>
            </div>

        </div>


        <div class="description">

            <strong>Açıklama</strong>

            <div style="margin-top:8px;">
                ${guvenliMetin(
                    ilan.aciklama || "Açıklama girilmemiş."
                )}
            </div>

        </div>


        <div class="actions">

            <button
                class="btn-yayinda"
                onclick="durumDegistir(${ilan.id}, 'yayinda')"
            >
                ✓ Yayına Al
            </button>


            <button
                class="btn-satildi"
                onclick="durumDegistir(${ilan.id}, 'satildi')"
            >
                ✓ Satıldı
            </button>


            <button
                class="btn-iptal"
                onclick="durumDegistir(${ilan.id}, 'iptal')"
            >
                ✕ İptal Et
            </button>


            <button
                class="btn-beklemede"
                onclick="durumDegistir(${ilan.id}, 'beklemede')"
            >
                ↻ Beklemeye Al
            </button>

        </div>

    `;


    document.getElementById(
        "modal"
    ).style.display =
        "block";

}


/* DURUM DEĞİŞTİR */

async function durumDegistir(id, durum){

    const onay =
        confirm(
            "Bu başvurunun durumunu değiştirmek istediğinize emin misiniz?"
        );


    if(!onay){
        return;
    }


    try{

        const cevap =
            await fetch(
                "/api/ilanlar/" + id,
                {
                    method:"PATCH",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            durum:durum
                        })
                }
            );


        const sonuc =
            await cevap.json();


        if(
            !cevap.ok ||
            !sonuc.basarili
        ){

            throw new Error(
                sonuc.hata ||
                "Durum değiştirilemedi."
            );

        }


        alert(
            "İlan durumu başarıyla değiştirildi."
        );


        modalKapat();


        await basvurulariGetir();

    }
    catch(hata){

        alert(
            "İşlem başarısız:\n\n" +
            hata.message
        );

    }

}


/* MODAL KAPAT */

function modalKapat(){

    document.getElementById(
        "modal"
    ).style.display =
        "none";

}


/* MODAL DIŞINA TIKLAYINCA KAPAT */

document.getElementById(
    "modal"
).addEventListener(
    "click",
    function(event){

        if(
            event.target === this
        ){

            modalKapat();

        }

    }
);


/* SAYFA AÇILINCA */

basvurulariGetir();

</script>

</body>
</html>
