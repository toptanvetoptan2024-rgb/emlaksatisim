<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EmlakSatışım.com | Gayrimenkulünüzü Satın</title>

<meta name="description"
content="Gayrimenkulünüzü EmlakSatışım.com ile doğru alıcılara ulaştırın. Ücretsiz ilan başvurunuzu hemen yapın.">

<style>

/* =========================================================
   GENEL
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    padding:0;
    background:#f3f7fa;
    color:#102d50;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

img{
    display:block;
    max-width:100%;
}


/* =========================================================
   ANA GÖRSEL
========================================================= */

.hero{
    position:relative;
    width:100%;
    background:#fff;
    overflow:hidden;
}

.hero picture,
.hero picture img{
    display:block;
    width:100%;
    height:auto;
}


/* =========================================================
   GÖRSEL ÜZERİ TIKLAMA ALANLARI
========================================================= */

.hero-link{
    position:absolute;
    display:block;
    z-index:20;
    cursor:pointer;
}


/* =========================================================
   MASAÜSTÜ TIKLAMA ALANLARI
========================================================= */

/* WhatsApp */

.whatsapp-link{
    left:31.2%;
    top:51.3%;
    width:37%;
    height:8.5%;
}


/* Ücretsiz ilan */

.ilan-link{
    left:31.2%;
    top:62.5%;
    width:37%;
    height:8.5%;
}


/* =========================================================
   FORM
========================================================= */

.form-section{
    background:#f3f7fa;
    padding:50px 15px 70px;
}

.form-container{
    width:min(1150px,100%);
    margin:0 auto;
    padding:38px;
    background:#fff;
    border-radius:24px;
    box-shadow:0 12px 40px rgba(16,45,80,.12);
}


/* =========================================================
   FORM BAŞLIK
========================================================= */

.form-header{
    margin-bottom:30px;
}

.form-header h2{
    margin-bottom:9px;
    color:#102d50;
    font-size:32px;
    line-height:1.2;
    font-weight:900;
}

.form-header p{
    color:#667587;
    font-size:16px;
    line-height:1.5;
}


/* =========================================================
   FORM GRID
========================================================= */

.form-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.field label{
    color:#173755;
    font-size:14px;
    font-weight:800;
}

.field input,
.field select,
.field textarea{
    width:100%;
    border:1px solid #d4dce5;
    border-radius:9px;
    background:#fff;
    color:#173755;
    padding:13px 14px;
    outline:none;
    font-family:Arial,Helvetica,sans-serif;
    font-size:15px;
    transition:.2s;
}

.field input,
.field select{
    height:48px;
}

.field textarea{
    min-height:120px;
    resize:vertical;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
    border-color:#ff7200;
    box-shadow:0 0 0 3px rgba(255,114,0,.10);
}

.full{
    grid-column:1 / -1;
}


/* =========================================================
   FOTOĞRAF ALANI
========================================================= */

.photo-box{
    padding:25px;
    border:2px dashed #c8d2dd;
    border-radius:12px;
    background:#fafcff;
    text-align:center;
}

.photo-title{
    margin-bottom:7px;
    color:#173755;
    font-size:16px;
    font-weight:800;
}

.photo-description{
    margin-bottom:15px;
    color:#788695;
    font-size:13px;
}

.photo-box input{
    max-width:100%;
}


/* =========================================================
   GÖNDER BUTONU
========================================================= */

.submit-button{
    width:100%;
    height:60px;
    border:0;
    border-radius:10px;
    background:#ff7200;
    color:#fff;
    font-size:19px;
    font-weight:900;
    cursor:pointer;
    transition:.2s;
}

.submit-button:hover{
    background:#e96600;
    transform:translateY(-1px);
}

.form-note{
    margin-top:12px;
    color:#718092;
    font-size:12px;
    text-align:center;
}


/* =========================================================
   FOOTER
========================================================= */

.footer{
    padding:28px 15px;
    background:#102d50;
    color:#fff;
    text-align:center;
}

.footer-logo{
    font-size:23px;
    font-weight:900;
}

.footer-logo span{
    color:#ff7200;
}

.footer-slogan{
    margin-top:5px;
    font-size:11px;
    letter-spacing:2px;
    opacity:.85;
}

.footer-copy{
    margin-top:12px;
    font-size:12px;
    opacity:.65;
}


/* =========================================================
   TABLET
========================================================= */

@media(max-width:900px){

    .form-grid{
        grid-template-columns:repeat(2,1fr);
    }

}


/* =========================================================
   MOBİL
========================================================= */

@media(max-width:600px){

    .form-section{
        padding:25px 10px 45px;
    }

    .form-container{
        padding:22px 15px;
        border-radius:18px;
    }

    .form-header{
        margin-bottom:22px;
    }

    .form-header h2{
        font-size:23px;
    }

    .form-header p{
        font-size:13px;
    }

    .form-grid{
        grid-template-columns:1fr;
        gap:15px;
    }

    .full{
        grid-column:auto;
    }

    .submit-button{
        height:56px;
        font-size:17px;
    }

    .footer{
        padding:23px 10px;
    }

    .footer-logo{
        font-size:20px;
    }


    /* =====================================================
       MOBİL GÖRSEL BUTONLARI

       design-mobile.png için
    ===================================================== */

   .whatsapp-link{
    left:15%;
    top:57.5%;
    width:70%;
    height:7%;
}

.ilan-link{
    left:15%;
    top:66%;
    width:70%;
    height:7%;
}

}


/* =========================================================
   ÇOK KÜÇÜK TELEFON
========================================================= */

@media(max-width:380px){

    .form-container{
        padding:18px 12px;
    }

    .form-header h2{
        font-size:21px;
    }

    .field input,
    .field select,
    .field textarea{
        font-size:14px;
    }

}

</style>

</head>


<body>


<!-- =======================================================
     ANA SAYFA
======================================================= -->

<section class="hero">


    <!--
        BİLGİSAYAR:
        design.png

        TELEFON:
        design-mobile.png
    -->

    <picture>

        <source
            media="(max-width: 600px)"
            srcset="design-mobile.png"
        >

        <img
            src="design.png"
            alt="EmlakSatışım.com - Emlakta Doğru Adres"
            class="hero-image"
        >

    </picture>


    <!-- ===================================================
         WHATSAPP
    ==================================================== -->

    <a
        href="https://wa.me/905300316127?text=Merhaba%2C%20gayrimenkulümü%20satmak%20istiyorum."
        target="_blank"
        class="hero-link whatsapp-link"
        aria-label="WhatsApp ile iletişime geç"
    ></a>


    <!-- ===================================================
         ÜCRETSİZ İLAN VER
    ==================================================== -->

    <a
        href="#basvuru"
        class="hero-link ilan-link"
        aria-label="Ücretsiz ilan ver"
    ></a>


</section>



<!-- =======================================================
     BAŞVURU FORMU
======================================================= -->

<section
    class="form-section"
    id="basvuru"
>

    <div class="form-container">


        <div class="form-header">

            <h2>
                Ücretsiz İlan Ver Başvuru Formu
            </h2>

            <p>
                Gayrimenkulünüzün bilgilerini bırakın.
                En kısa sürede sizinle iletişime geçelim.
            </p>

        </div>



        <form id="ilanForm">


            <div class="form-grid">


                <!-- AD SOYAD -->

                <div class="field">

                    <label>
                        Ad Soyad *
                    </label>

                    <input
                        type="text"
                        name="ad_soyad"
                        placeholder="Adınız ve soyadınız"
                        required
                    >

                </div>


                <!-- TELEFON -->

                <div class="field">

                    <label>
                        Telefon *
                    </label>

                    <input
                        type="tel"
                        name="telefon"
                        placeholder="05XX XXX XX XX"
                        required
                    >

                </div>


                <!-- E-POSTA -->

                <div class="field">

                    <label>
                        E-posta
                    </label>

                    <input
                        type="email"
                        name="email"
                        placeholder="ornek@mail.com"
                    >

                </div>


                <!-- GAYRİMENKUL -->

                <div class="field">

                    <label>
                        Gayrimenkul Türü *
                    </label>

                    <select
                        name="ilan_turu"
                        required
                    >

                        <option value="">
                            Seçiniz
                        </option>

                        <option value="Daire">
                            Daire
                        </option>

                        <option value="Villa">
                            Villa
                        </option>

                        <option value="Müstakil Ev">
                            Müstakil Ev
                        </option>

                        <option value="Dükkan">
                            Dükkan
                        </option>

                        <option value="Ofis">
                            Ofis
                        </option>

                        <option value="Arsa">
                            Arsa
                        </option>

                        <option value="Arazi">
                            Arazi
                        </option>

                    </select>

                </div>


                <!-- İŞLEM -->

                <div class="field">

                    <label>
                        İşlem Türü *
                    </label>

                    <select
                        name="islem_turu"
                        required
                    >

                        <option value="">
                            Seçiniz
                        </option>

                        <option value="Satılık">
                            Satılık
                        </option>

                        <option value="Kiralık">
                            Kiralık
                        </option>

                    </select>

                </div>


                <!-- İL -->

                <div class="field">

                    <label>
                        İl *
                    </label>

                    <select
                        name="il"
                        required
                    >

                        <option value="">
                            Seçiniz
                        </option>

                        <option value="İstanbul">
                            İstanbul
                        </option>

                    </select>

                </div>


                <!-- İLÇE -->

                <div class="field">

                    <label>
                        İlçe *
                    </label>

                    <select
                        name="ilce"
                        required
                    >

                        <option value="">
                            Seçiniz
                        </option>

                        <option value="Sultangazi">
                            Sultangazi
                        </option>

                        <option value="Gaziosmanpaşa">
                            Gaziosmanpaşa
                        </option>

                        <option value="Arnavutköy">
                            Arnavutköy
                        </option>

                        <option value="Başakşehir">
                            Başakşehir
                        </option>

                        <option value="Esenler">
                            Esenler
                        </option>

                    </select>

                </div>


                <!-- MAHALLE -->

                <div class="field">

                    <label>
                        Mahalle
                    </label>

                    <input
                        type="text"
                        name="mahalle"
                        placeholder="Mahalle adı"
                    >

                </div>


                <!-- FİYAT -->

                <div class="field">

                    <label>
                        Satış Fiyatı (TL)
                    </label>

                    <input
                        type="number"
                        name="fiyat"
                        placeholder="Örn: 2500000"
                    >

                </div>


                <!-- METREKARE -->

                <div class="field">

                    <label>
                        Metrekare
                    </label>

                    <input
                        type="number"
                        name="metrekare"
                        placeholder="Örn: 120"
                    >

                </div>


                <!-- ODA -->

                <div class="field">

                    <label>
                        Oda Sayısı
                    </label>

                    <select
                        name="oda_sayisi"
                    >

                        <option value="">
                            Seçiniz
                        </option>

                        <option value="1+0">
                            1+0
                        </option>

                        <option value="1+1">
                            1+1
                        </option>

                        <option value="2+1">
                            2+1
                        </option>

                        <option value="3+1">
                            3+1
                        </option>

                        <option value="4+1">
                            4+1
                        </option>

                        <option value="5+1">
                            5+1
                        </option>

                    </select>

                </div>


                <!-- AÇIKLAMA -->

                <div class="field full">

                    <label>
                        Gayrimenkul Açıklaması
                    </label>

                    <textarea
                        name="aciklama"
                        placeholder="Gayrimenkulünüz hakkında bilgi verin..."
                    ></textarea>

                </div>


                <!-- FOTOĞRAFLAR -->

                <div class="field full">

                    <label>
                        Gayrimenkul Fotoğrafları
                    </label>

                    <div class="photo-box">

                        <div class="photo-title">
                            📷 Fotoğraflarınızı Ekleyin
                        </div>

                        <div class="photo-description">
                            Birden fazla fotoğraf seçebilirsiniz.
                        </div>

                        <input
                            type="file"
                            name="fotograflar"
                            accept="image/jpeg,image/png,image/webp"
                            multiple
                        >

                    </div>

                </div>


                <!-- GÖNDER -->

                <div class="field full">

                    <button
                        type="submit"
                        class="submit-button"
                    >
                        ÜCRETSİZ İLAN BAŞVURUMU GÖNDER →
                    </button>

                    <div class="form-note">
                        🔒 Bilgileriniz güvenli şekilde saklanır.
                    </div>

                </div>


            </div>

        </form>

    </div>

</section>



<!-- =======================================================
     FOOTER
======================================================= -->

<footer class="footer">

    <div class="footer-logo">
        Emlak<span>Satışım</span>.com
    </div>

    <div class="footer-slogan">
        EMLAKTA DOĞRU ADRES
    </div>

    <div class="footer-copy">
        © 2026 EmlakSatışım.com
    </div>

</footer>



<script>

/* =========================================================
   FORM
========================================================= */

document
.getElementById("ilanForm")
.addEventListener("submit", function(event){

    event.preventDefault();

    const ad =
        document
        .querySelector('[name="ad_soyad"]')
        .value
        .trim();

    const telefon =
        document
        .querySelector('[name="telefon"]')
        .value
        .trim();


    if(!ad || !telefon){

        alert(
            "Lütfen Ad Soyad ve Telefon alanlarını doldurun."
        );

        return;

    }


    alert(
        "Başvurunuz alındı.\n\n" +
        "En kısa sürede sizinle iletişime geçeceğiz."
    );

});

</script>


</body>
</html>
