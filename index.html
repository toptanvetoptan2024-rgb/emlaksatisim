<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EmlakSatışım | Ücretsiz İlan Ver</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;font-family:Arial,Helvetica,sans-serif}
.page{position:relative;width:min(100%,1024px);margin:0 auto;aspect-ratio:1024/1536;background:url("design.png") center top/100% 100% no-repeat;overflow:hidden}
.form{position:absolute;left:9.25%;top:44.05%;width:81.8%;height:30.0%}
input,select,textarea{position:absolute;background:rgba(255,255,255,.92);border:1px solid #d9e1ea;border-radius:7px;padding:0 14px;color:#14263d;font-size:clamp(10px,1.25vw,16px);outline:none}
input:focus,select:focus,textarea:focus{border:2px solid #ff7800}
.f1{left:0;top:9.7%;width:31.2%;height:6.2%}
.f2{left:33.5%;top:9.7%;width:31.2%;height:6.2%}
.f3{left:66.8%;top:9.7%;width:31.2%;height:6.2%}
.f4{left:0;top:19.9%;width:31.2%;height:6.2%}
.f5{left:33.5%;top:19.9%;width:31.2%;height:6.2%}
.f6{left:66.8%;top:19.9%;width:31.2%;height:6.2%}
.f7{left:0;top:29.9%;width:31.2%;height:6.2%}
.f8{left:33.5%;top:29.9%;width:31.2%;height:6.2%}
.f9{left:66.8%;top:29.9%;width:31.2%;height:6.2%}
.f10{left:0;top:40%;width:31.2%;height:6.2%}
.f11{left:33.5%;top:40%;width:31.2%;height:6.2%}
.f12{left:66.8%;top:40%;width:31.2%;height:6.2%}
.f13{left:0;top:50.2%;width:97.9%;height:10.3%;padding-top:9px;resize:none}
.files{position:absolute;left:0;top:62.8%;width:97.9%;height:8.0%;opacity:0;cursor:pointer}
.submit{position:absolute;left:0;top:72%;width:97.9%;height:7.2%;border:0;background:transparent;cursor:pointer}
.wa{position:absolute;left:24.2%;top:22.9%;width:51.2%;height:5.8%;border-radius:40px;background:transparent;border:0;cursor:pointer}
.free{position:absolute;left:35%;top:8%;width:30%;height:7%;background:transparent;border:0;cursor:pointer}

@media(max-width:650px){
input,select,textarea{font-size:10px;padding:0 7px}
.form{top:44.05%}
}

@media(max-width:430px){
input,select,textarea{font-size:8px}
}
</style>
</head>

<body>

<div class="page">

<a class="wa"
href="https://wa.me/905300316127?text=Merhaba%2C%20gayrimenkulümü%20satmak%20istiyorum."
target="_blank"
rel="noopener"
aria-label="WhatsApp ile iletişim"></a>

<a class="free"
href="#ilan-formu"
aria-label="Ücretsiz ilan ver"></a>

<form id="ilan-formu" class="form">

<input class="f1" name="ad_soyad" required aria-label="Ad Soyad">

<input class="f2" name="telefon" required inputmode="tel" aria-label="Telefon">

<input class="f3" name="email" type="email" aria-label="E-posta">

<select class="f4" name="ilan_turu" required aria-label="Gayrimenkul Türü">
<option value="">Seçiniz</option>
<option>Daire</option>
<option>Villa</option>
<option>Müstakil Ev</option>
<option>Dükkan</option>
<option>Ofis</option>
<option>Arsa</option>
<option>Turistik Tesis</option>
</select>

<select class="f5" name="islem_turu" required aria-label="İşlem Türü">
<option value="">Seçiniz</option>
<option>Satılık</option>
</select>

<select class="f6" name="il" required aria-label="İl">
<option value="">Seçiniz</option>
<option>İstanbul</option>
</select>

<select class="f7" name="ilce" required aria-label="İlçe">
<option value="">Seçiniz</option>
<option>Sultangazi</option>
<option>Arnavutköy</option>
<option>Başakşehir</option>
<option>Gaziosmanpaşa</option>
<option>Eyüpsultan</option>
<option>Diğer</option>
</select>

<input class="f8" name="mahalle" aria-label="Mahalle">

<input class="f9" name="fiyat" inputmode="decimal" aria-label="Fiyat">

<input class="f10" name="metrekare" inputmode="decimal" aria-label="Metrekare">

<select class="f11" name="oda_sayisi" aria-label="Oda Sayısı">
<option value="">Seçiniz</option>
<option>1+0</option>
<option>1+1</option>
<option>2+1</option>
<option>3+1</option>
<option>4+1</option>
<option>5+1</option>
<option>Diğer</option>
</select>

<select class="f12" name="bina_yasi" aria-label="Bina Yaşı">
<option value="">Seçiniz</option>
<option>0-5</option>
<option>6-10</option>
<option>11-20</option>
<option>21+</option>
</select>

<textarea class="f13"
name="aciklama"
aria-label="Açıklama"></textarea>

<input
class="files"
type="file"
name="fotograflar"
accept="image/jpeg,image/png"
multiple
aria-label="Fotoğraflar">

<button
class="submit"
type="submit"
aria-label="Ücretsiz ilan başvurusunu gönder">
</button>

</form>
</div>

<script>
document.getElementById('ilan-formu').addEventListener('submit',function(e){
e.preventDefault();

alert('Başvurunuz hazır. Yönetim paneli bağlantısı kurulduğunda bu form doğrudan panele kaydedilecektir.');

});
</script>

</body>
</html>
