<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EmlakSatışım.com | Gayrimenkulünüzü Satmak İçin Doğru Adres</title>
<meta name="description" content="Evinizi, dükkânınızı veya arsanızı satmak mı istiyorsunuz? EmlakSatışım.com ile ücretsiz ilan başvurunuzu oluşturun.">
<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
    background:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overflow-x:hidden;
}

.site{
    position:relative;
    width:100%;
    max-width:1024px;
    margin:0 auto;
    line-height:1.2;
}

.design{
    display:block;
    width:100%;
    height:auto;
    user-select:none;
    -webkit-user-drag:none;
}

/* TIKLANABİLİR ALANLAR */
.click-area{
    position:absolute;
    display:block;
    z-index:10;
    cursor:pointer;
}

/* WHATSAPP */
.whatsapp{
    left:24.5%;
    top:22.8%;
    width:51%;
    height:5.4%;
    border-radius:60px;
    background:transparent;
}

/* FORM ALANI */
.form-field{
    position:absolute;
    z-index:20;
    border:1px solid #d6dce3;
    background:rgba(255,255,255,.94);
    color:#172b45;
    border-radius:7px;
    padding:0 1.2%;
    outline:none;
    font-size:clamp(8px,1.35vw,14px);
    font-family:Arial,Helvetica,sans-serif;
}

.form-field:focus{
    border-color:#ff7a00;
    box-shadow:0 0 0 2px rgba(255,122,0,.12);
}

.form-field::placeholder{
    color:#8b94a0;
}

/* 1. SATIR */
.adsoyad{
    left:9.2%;
    top:44.05%;
    width:25.7%;
    height:2.75%;
}

.telefon{
    left:37.5%;
    top:44.05%;
    width:25.7%;
    height:2.75%;
}

.email{
    left:66.1%;
    top:44.05%;
    width:25.7%;
    height:2.75%;
}

/* 2. SATIR */
.ilan-turu{
    left:9.2%;
    top:48.85%;
    width:25.7%;
    height:2.75%;
}

.islem-turu{
    left:37.5%;
    top:48.85%;
    width:25.7%;
    height:2.75%;
}

.il{
    left:66.1%;
    top:48.85%;
    width:25.7%;
    height:2.75%;
}

/* 3. SATIR */
.ilce{
    left:9.2%;
    top:53.65%;
    width:25.7%;
    height:2.75%;
}

.mahalle{
    left:37.5%;
    top:53.65%;
    width:25.7%;
    height:2.75%;
}

.fiyat{
    left:66.1%;
    top:53.65%;
    width:25.7%;
    height:2.75%;
}

/* 4. SATIR */
.metrekare{
    left:9.2%;
    top:58.45%;
    width:25.7%;
    height:2.75%;
}

.oda{
    left:37.5%;
    top:58.45%;
    width:25.7%;
    height:2.75%;
}

.bina-yasi{
    left:66.1%;
    top:58.45%;
    width:25.7%;
    height:2.75%;
}

/* AÇIKLAMA */
.aciklama{
    position:absolute;
    z-index:20;
    left:9.2%;
    top:63.15%;
    width:81.6%;
    height:5.5%;
    resize:none;
    border:1px solid #d6dce3;
    background:rgba(255,255,255,.94);
    border-radius:7px;
    padding:1% 1.2%;
    outline:none;
    color:#172b45;
    font-size:clamp(8px,1.35vw,14px);
    font-family:Arial,Helvetica,sans-serif;
}

.aciklama:focus{
    border-color:#ff7a00;
    box-shadow:0 0 0 2px rgba(255,122,0,.12);
}

/* FOTOĞRAF YÜKLEME */
.fotograflar{
    position:absolute;
    z-index:20;
    left:9.2%;
    top:70.3%;
    width:81.6%;
    height:4.1%;
    opacity:0;
    cursor:pointer;
}

/* GÖNDER BUTONU */
.submit{
    position:absolute;
    z-index:30;
    left:9.2%;
    top:75.1%;
    width:81.6%;
    height:4.3%;
    border:0;
    border-radius:8px;
    background:transparent;
    cursor:pointer;
}

/* MOBİL */
@media(max-width:600px){

    .site{
        width:100%;
        max-width:none;
    }

    .form-field{
        font-size:clamp(7px,2.6vw,13px);
        border-radius:4px;
        padding:0 2%;
    }

    .aciklama{
        font-size:clamp(7px,2.6vw,13px);
        border-radius:4px;
        padding:1.5% 2%;
    }

    .whatsapp{
        border-radius:40px;
    }

    .submit{
        border-radius:5px;
    }
}

/* ÇOK KÜÇÜK TELEFONLAR */
@media(max-width:380px){

    .form-field{
        font-size:7px;
    }

    .aciklama{
        font-size:7px;
    }
}

</head>

<body>

<div class="site">

    <img
        src="design.png"
        class="design"
        alt="EmlakSatışım.com - Gayrimenkul Satış ve Ücretsiz İlan Başvurusu"
    >

    <!-- WHATSAPP -->
    <a
        class="click-area whatsapp"
        href="https://wa.me/905300316127?text=Merhaba%2C%20gayrimenkulümü%20satmak%20istiyorum."
        target="_blank"
        rel="noopener"
        aria-label="WhatsApp ile iletişime geç"
    ></a>

    <!-- FORM -->
    <form id="ilanForm">

        <input
            class="form-field adsoyad"
            type="text"
            name="ad_soyad"
            placeholder="Adınız ve soyadınız"
            required
        >

        <input
            class="form-field telefon"
            type="tel"
            name="telefon"
            placeholder="05XX XXX XX XX"
            required
        >

        <input
            class="form-field email"
            type="email"
            name="email"
            placeholder="ornek@mail.com"
        >

        <select
            class="form-field ilan-turu"
            name="ilan_turu"
            required
        >
            <option value="">Seçiniz</option>
            <option value="Ev">Ev</option>
            <option value="Daire">Daire</option>
            <option value="Villa">Villa</option>
            <option value="Dükkan">Dükkan</option>
            <option value="Ofis">Ofis</option>
            <option value="Arsa">Arsa</option>
            <option value="Arazi">Arazi</option>
            <option value="Diğer">Diğer</option>
        </select>

        <select
            class="form-field islem-turu"
            name="islem_turu"
            required
        >
            <option value="">Seçiniz</option>
            <option value="Satılık">Satılık</option>
            <option value="Kiralık">Kiralık</option>
        </select>

        <select
            class="form-field il"
            name="il"
            required
        >
            <option value="">Seçiniz</option>
            <option value="İstanbul">İstanbul</option>
            <option value="Diğer">Diğer</option>
        </select>

        <select
            class="form-field ilce"
            name="ilce"
            required
        >
            <option value="">Seçiniz</option>
            <option value="Sultangazi">Sultangazi</option>
            <option value="Gaziosmanpaşa">Gaziosmanpaşa</option>
            <option value="Arnavutköy">Arnavutköy</option>
            <option value="Başakşehir">Başakşehir</option>
            <option value="Esenler">Esenler</option>
            <option value="Diğer">Diğer</option>
        </select>

        <input
            class="form-field mahalle"
            type="text"
            name="mahalle"
            placeholder="Mahalle adı"
        >

        <input
            class="form-field fiyat"
            type="number"
            name="fiyat"
            placeholder="Örnek: 2.500.000"
        >

        <input
            class="form-field metrekare"
            type="number"
            name="metrekare"
            placeholder="Örnek: 120"
        >

        <select
            class="form-field oda"
            name="oda_sayisi"
        >
            <option value="">Seçiniz</option>
            <option value="1+0">1+0</option>
            <option value="1+1">1+1</option>
            <option value="2+1">2+1</option>
            <option value="3+1">3+1</option>
            <option value="4+1">4+1</option>
            <option value="5+1">5+1</option>
            <option value="Diğer">Diğer</option>
        </select>

        <select
            class="form-field bina-yasi"
            name="bina_yasi"
        >
            <option value="">Seçiniz</option>
            <option value="0">0</option>
            <option value="1-5">1-5</option>
            <option value="6-10">6-10</option>
            <option value="11-20">11-20</option>
            <option value="21+">21+</option>
        </select>

        <textarea
            class="aciklama"
            name="aciklama"
            placeholder="Emlakınız ile ilgili detayları yazınız..."
        ></textarea>

        <input
            class="fotograflar"
            type="file"
            name="fotograflar"
            accept="image/jpeg,image/png,image/webp"
            multiple
        >

        <button
            class="submit"
            type="submit"
            aria-label="Ücretsiz ilan başvurumu gönder"
        ></button>

    </form>

</div>

<script>
document.getElementById("ilanForm").addEventListener("submit", function(e){

    e.preventDefault();

    const ad = document.querySelector('[name="ad_soyad"]').value;
    const telefon = document.querySelector('[name="telefon"]').value;

    if(!ad || !telefon){
        alert("Lütfen zorunlu alanları doldurun.");
        return;
    }

    alert(
        "Başvurunuz hazırlandı.\n\n" +
        "Ad Soyad: " + ad + "\n" +
        "Telefon: " + telefon + "\n\n" +
        "Başvurunuz en kısa sürede değerlendirilecektir."
    );
});
</script>

</body>
</html>
