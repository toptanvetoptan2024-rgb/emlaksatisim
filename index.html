<!DOCTYPE html>
<html lang="tr"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EmlakSatisim.com | Yapım Aşamasında</title>
    <meta name="description" content="EmlakSatisim.com çok yakında hizmetinizde. Emlakta Doğru Adres.">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #07111f;
            font-family: Arial, Helvetica, sans-serif;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        .logo {
            font-size: clamp(38px, 8vw, 72px);
            font-weight: 900;
            letter-spacing: -2px;
            margin-bottom: 8px;
        }

        .logo .emlak {
            color: #ffffff;
        }

        .logo .satisim {
            color: #ff7a00;
        }

        .tagline {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 4px;
            color: #cbd5e1;
            margin-bottom: 45px;
        }

        .icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 30px;
            border: 3px solid #ff7a00;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 46px;
        }

        h1 {
            font-size: clamp(32px, 7vw, 52px);
            font-weight: 900;
            margin-bottom: 18px;
        }

        .orange {
            color: #ff7a00;
        }

        .text {
            color: #cbd5e1;
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 35px;
        }

        .line {
            width: 80px;
            height: 4px;
            background: #ff7a00;
            border-radius: 10px;
            margin: 0 auto 30px;
        }

        .contact {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #25d366;
            color: #fff;
            text-decoration: none;
            padding: 15px 28px;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 900;
            transition: .2s;
        }

        .contact:hover {
            transform: translateY(-2px);
        }

        .website {
            margin-top: 35px;
            color: #94a3b8;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px;
            }

            .tagline {
                font-size: 11px;
                letter-spacing: 2.5px;
                margin-bottom: 35px;
            }

            .icon {
                width: 82px;
                height: 82px;
                font-size: 38px;
                margin-bottom: 25px;
            }

            .text {
                font-size: 16px;
            }

            .contact {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="logo">
            <span class="emlak">Emlak</span><span class="satisim">Satışım</span><span class="emlak">.com</span>
        </div>

        <div class="tagline">
            EMLAKTA DOĞRU ADRES
        </div>

        <div class="icon">
            🏠
        </div>

        <h1>
            <span class="orange">Çok Yakında</span><br>
            Hizmetinizdeyiz
        </h1>

        <div class="line"></div>

        <p class="text">
            EmlakSatisim.com yeni yüzüyle<br>
            çok yakında sizlerle.
            <br><br>
            <strong>Doğrudan sahibinden gayrimenkul</strong><br>
            fırsatları için bizi takip edin.
        </p>

        <a
            class="contact"
            href="https://wa.me/905300316127"
            target="_blank"
            rel="noopener"
        >
            WhatsApp'tan Bize Ulaşın
        </a>

        <div class="website">
            www.emlaksatisim.com
        </div>

    </main>

</body>
</html>
